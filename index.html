<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST -绿色蔬菜-</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 60px 40px;
            background-color: #ffffff;
            color: #37245f;
        }
        /* 选中文本样式 */
        ::selection {
            background: #000000;
            color: #ffffff;
        }
        ::-moz-selection {
            background: #000000;
            color: #ffffff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }
        h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 0.2em;
            letter-spacing: -0.5px;
            color: #37245f;
        }
        .subtitle {
            font-size: 1.2em;
            color: #37245f;
            margin-bottom: 3em;
            font-weight: 400;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.8em;
            height: 1.8em;
            transition: background-color 0.3s ease;
            text-decoration: none;
        }
        .icon {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #37245f;   /* 默认颜色 */
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            transition: background-color 0.3s ease;
        }
        .button:hover .icon {
            background-color: #000000;   /* 悬停颜色 */
        }
        /* 固定红色图标：不参与颜色变化 */
        .icon.fixed-red {
            background-color: #ff0000 !important;  /* 始终红色 */
        }
        .button:hover .icon.fixed-red {
            background-color: #ff0000 !important;  /* 悬停也保持红色 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ST</h1>
        <div class="subtitle">-绿色蔬菜-</div>

        <div class="button-group">
            <!-- 文章 -->
            <a class="button" href="articles.html" title="文章">
                <span class="icon" style="mask-image: url('book.png'); -webkit-mask-image: url('book.png');"></span>
            </a>

            <!-- 切割模拟器（红色图标固定） -->
            <a class="button" href="https://wwamr.lanzoum.com/iOgcJ42bzn7i" target="_blank" title="切割模拟器">
                <span class="icon fixed-red" style="mask-image: url('qgq.png'); -webkit-mask-image: url('qgq.png');"></span>
            </a>

            <!-- B站首页 -->
            <a class="button" href="https://space.bilibili.com/3546387744557738?spm_id_from=333.337.0.0" target="_blank" title="B站首页">
                <span class="icon" style="mask-image: url('bilibili.png'); -webkit-mask-image: url('bilibili.png');"></span>
            </a>

            <!-- X -->
            <a class="button" href="https://x.com/i/status/2075440775723413893" target="_blank" title="X">
                <span class="icon" style="mask-image: url('X.png'); -webkit-mask-image: url('X.png');"></span>
            </a>

            <!-- 支持我（爱发电） -->
            <a class="button" href="https://www.ifdian.net/order/create?user_id=9c51d8d47bff11f1bdbd5254001e7c00&amp;remark=&amp;affiliate_code=" target="_blank" title="支持我">
                <span class="icon" style="mask-image: url('happy.png'); -webkit-mask-image: url('happy.png');"></span>
            </a>
        </div>
    </div>
</body>
</html>
