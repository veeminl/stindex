<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST -绿色蔬菜-</title>
    <script>
        (function() {
            var savedMode = localStorage.getItem('theme-mode');
            if (savedMode === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>

    <style>
        /* ========== CSS 变量（浅色模式默认） ========== */
        :root {
            --bg-color: #ffffff;
            --text-color: #37245f;
            --hover-color: #000000;
            --grad-start: #ffffff;
            --grad-end: #000000;
            --grid-line: rgba(0, 0, 0, 0.3);
            --selection-bg: #000000;
            --selection-text: #ffffff;
            --icon-default: #37245f;
            --icon-hover: #000000;
        }

        /* ========== 深色模式变量 ========== */
        html.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --hover-color: #ffffff;
            --grad-start: #1a1a1a;
            --grad-end: #000000;
            --grid-line: rgba(255, 255, 255, 0.15);
            --selection-bg: #ffffff;
            --selection-text: #000000;
            --icon-default: #e0e0e0;
            --icon-hover: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            position: relative;
            transition: background-color 0.15s ease, color 0.15s ease, opacity 0.2s ease;
            opacity: 1;
        }

        /* 页面淡出状态 */
        body.page-fade-out {
            opacity: 0;
        }
        /* 页面淡入状态 */
        body.page-fade-in {
            opacity: 1;
        }

        /* 背景渐变层：从白到黑，20%强度 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, var(--grad-start) 0%, var(--grad-end) 100%);
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
            transition: background 0.15s ease;
        }

        /* 背景网格线层：铺满黑色网格，并从下到上线性擦除 */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            -webkit-mask-image: linear-gradient(to top, black 0%, transparent 100%);
            mask-image: linear-gradient(to top, black 0%, transparent 100%);
            transition: background-image 0.15s ease;
        }

        ::selection {
            background: var(--selection-bg);
            color: var(--selection-text);
        }
        ::-moz-selection {
            background: var(--selection-bg);
            color: var(--selection-text);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 40px;
            text-align: left;
        }

        h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 0.2em;
            letter-spacing: -0.5px;
            color: var(--text-color);
        }

        .subtitle {
            font-size: 1.2em;
            color: var(--text-color);
            margin-bottom: 3em;
            font-weight: 400;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2em;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: color 0.15s ease;
        }
        .button:hover {
            color: var(--hover-color);
        }

        .icon-container {
            position: relative;
            width: 1.2em;
            height: 1.2em;
            flex-shrink: 0;
        }

        .icon-mask {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: var(--icon-default);
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            transition: background-color 0.15s ease;
        }
        .button:hover .icon-mask {
            background-color: var(--icon-hover);
        }

        .icon-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ST</h1>
        <div class="subtitle">-绿色蔬菜-</div>

        <div class="button-group">
            <!-- 文章（仅图标，红色细节保留） -->
            <a class="button" href="articles.html">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('book.png'); -webkit-mask-image: url('book.png');"></span>
                    <img class="icon-overlay" src="bookred.png" alt="">
                </span>
            </a>

            <!-- 切割模拟器（图标+文字） -->
            <a class="button" href="https://wwamr.lanzoum.com/iOgcJ42bzn7i" target="_blank">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('qgq.png'); -webkit-mask-image: url('qgq.png');"></span>
                </span>
                天杀切割器
            </a>

            <!-- B站首页（仅图标） -->
            <a class="button" href="https://space.bilibili.com/3546387744557738?spm_id_from=333.337.0.0" target="_blank">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('bilibili.png'); -webkit-mask-image: url('bilibili.png');"></span>
                </span>
            </a>

            <!-- X（仅图标） -->
            <a class="button" href="https://x.com/i/status/2075440775723413893" target="_blank">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('X.png'); -webkit-mask-image: url('X.png');"></span>
                </span>
            </a>

            <!-- 支持我（图标+文字） -->
            <a class="button" href="https://www.ifdian.net/order/create?user_id=9c51d8d47bff11f1bdbd5254001e7c00&amp;remark=&amp;affiliate_code=" target="_blank">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('happy.png'); -webkit-mask-image: url('happy.png');"></span>
                </span>
                支持我
            </a>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="page-transition.js"></script>
</body>
</html>
