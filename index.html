<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST -绿色蔬菜-</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 60px 40px;
            background-color: #ffffff;
            color: #37245f;
        }
        ::selection {
            background: #000000;
            color: #ffffff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }
        h1 {
            font-size: 3em;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #37245f;
        }
        .subtitle {
            font-size: 1.2em;
            color: #37245f;
            margin-bottom: 3em;
            font-weight: 400;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }
        .button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2em;
            color: #37245f;
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }
        .button:hover {
            color: #000000;
        }

        /* 图标容器：mask 层 + 可选叠加层 */
        .icon-container {
            position: relative;
            width: 1.2em;
            height: 1.2em;
            flex-shrink: 0;
        }
        /* 主图标：通过 mask 显示，颜色可平滑过渡 */
        .icon-mask {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #37245f;
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            transition: background-color 0.3s ease;
        }
        .button:hover .icon-mask {
            background-color: #000000;
        }
        /* 常驻叠加层：直接显示原图（只含红色部分），不受 mask 影响 */
        .icon-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;   /* 不阻挡点击 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ST</h1>
        <div class="subtitle">-绿色蔬菜-</div>

        <div class="button-group">
            <!-- 文章（图标+叠加红色细节） -->
            <a class="button" href="articles.html">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('book.png'); -webkit-mask-image: url('book.png');"></span>
                    <img class="icon-overlay" src="bookred.png" alt="">
                </span>
            </a>

            <!-- 切割模拟器（图标+文字） -->
            <a class="button" href="https://wwamr.lanzoum.com/iOgcJ42bzn7i" target="_blank">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('qgq.png'); -webkit-mask-image: url('qgq.png');"></span>
                </span>
                天杀切割器
            </a>

            <!-- B站首页 -->
            <a class="button" href="https://space.bilibili.com/3546387744557738?spm_id_from=333.337.0.0" target="_blank">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('bilibili.png'); -webkit-mask-image: url('bilibili.png');"></span>
                </span>
            </a>

            <!-- X -->
            <a class="button" href="https://x.com/i/status/2075440775723413893" target="_blank">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('X.png'); -webkit-mask-image: url('X.png');"></span>
                </span>
            </a>

            <!-- 支持我（图标+文字） -->
            <a class="button" href="https://www.ifdian.net/order/create?user_id=9c51d8d47bff11f1bdbd5254001e7c00&amp;remark=&amp;affiliate_code=" target="_blank">
                <span class="icon-container">
                    <span class="icon-mask" style="mask-image: url('happy.png'); -webkit-mask-image: url('happy.png');"></span>
                </span>
                支持我
            </a>
        </div>
    </div>
</body>
</html>
