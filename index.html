<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameDare</title>
    <script>
        (function() {
            var savedMode = localStorage.getItem('theme-mode');
            if (savedMode === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
<link rel="icon" type="image/png" href="st.png">

    <style>
        /* ========== CSS 变量（浅色模式默认） ========== */
        :root {
            --bg-color: #ffffff;
            --text-color: #37245f;
            --hover-color: #000000;
            --grad-start: #ffffff;
            --grad-end: #000000;
            --grid-line: rgba(0, 0, 0, 0.3);
            --selection-bg: #000000;
            --selection-text: #ffffff;
            --icon-default: #37245f;
            --icon-hover: #000000;
        }

        /* ========== 深色模式变量 ========== */
        html.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --hover-color: #ffffff;
            --grad-start: #1a1a1a;
            --grad-end: #000000;
            --grid-line: rgba(255, 255, 255, 0.15);
            --selection-bg: #ffffff;
            --selection-text: #000000;
            --icon-default: #e0e0e0;
            --icon-hover: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            position: relative;
            overflow: hidden;
            height: 100vh;
            transition: background-color 0.15s ease, color 0.15s ease, opacity 0.2s ease;
            opacity: 1;
        }

        body.page-fade-out {
            opacity: 0;
        }
        body.page-fade-in {
            opacity: 1;
        }

        /* 背景渐变层 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, var(--grad-start) 0%, var(--grad-end) 100%);
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
            transition: background 0.15s ease;
        }

        /* 背景网格线层 */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            -webkit-mask-image: linear-gradient(to top, black 0%, transparent 100%);
            mask-image: linear-gradient(to top, black 0%, transparent 100%);
            transition: background-image 0.15s ease;
        }

        ::selection {
            background: var(--selection-bg);
            color: var(--selection-text);
        }
        ::-moz-selection {
            background: var(--selection-bg);
            color: var(--selection-text);
        }

        /* ========== 标题组：左侧 200px，垂直居中 ========== */
        .left-title-group {
            position: absolute;
            left: 200px;
            top: 50%;
            transform: translateY(-50%);
            text-align: left;
            z-index: 5;
            pointer-events: none;
        }

        .main-title {
            font-size: 3.75em;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-color);
            margin-bottom: 0.2em;
        }

        .sub-title {
            font-size: 0.9em;
            color: var(--text-color);
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ========== TS 图片入口：右侧垂直居中，无上移 ========== */
        .game-entry {
            position: absolute;
            right: 400px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-block;
            text-decoration: none;
            z-index: 5;
        }

        .game-entry img {
            display: block;
            width: 360px;
            height: 360px;
            object-fit: cover;
            border: none;
            border-radius: 0;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            transition: border 0.15s ease;
        }

        .game-entry:hover img {
            border: 1px solid #ffffff;
            outline: 1px solid #000000;
            outline-offset: 1px;
        }

        .game-label {
            position: absolute;
            top: -1.5em;
            left: 0px;
            font-size: 0.6em;
            color: var(--text-color);
            padding: 0 4px;
            letter-spacing: 0.3px;
            pointer-events: none;
            z-index: 3;
            transition: color 0.15s ease;
        }

        .game-entry:hover .game-label {
            color: var(--hover-color);
        }

        .game-entry .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #ffffff;
            opacity: 0;
            transition: opacity 0.15s ease;
            pointer-events: none;
            z-index: 2;
        }

        .game-entry:hover .bottom-bar {
            opacity: 1;
        }

        /* ========== 底部按钮组（固定） ========== */
        .bottom-button-group {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 10px 5px;
            z-index: 10;
            max-width: 100%;
            width: auto;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.6em;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: 0.15px;
            transition: color 0.15s ease;
        }
        .button:hover {
            color: var(--hover-color);
        }

        /* 图标容器：放大一倍 */
        .icon-container {
            position: relative;
            width: 1.2em;      /* 原 0.6em × 2 */
            height: 1.2em;
            flex-shrink: 0;
        }

        /* 使用 mask 上色的图标 */
        .icon-mask {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: var(--icon-default);
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            transition: background-color 0.15s ease;
        }
        .button:hover .icon-mask {
            background-color: var(--icon-hover);
        }

        /* 直接显示原图的图标（如 infor.png） */
        .icon-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
        }

        .icon-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 标题组：左侧 200px，垂直居中 -->
    <div class="left-title-group">
        <h1 class="main-title">I DOMINATE ALL</h1>
        <h1 class="main-title">THIS</h1>
        <p class="sub-title">Records my words, shares my games, showcases my homepage.</p>
    </div>

    <!-- TS 图片入口：右侧垂直居中 -->
    <a class="game-entry" href="https://wwamr.lanzoum.com/iOgcJ42bzn7i" target="_blank">
        <span class="game-label">天杀星刀 Heaven-Killing Star Blade</span>
        <img src="ts.png" alt="天杀切割器">
        <span class="bottom-bar"></span>
    </a>

    <!-- 底部固定按钮组：隐私政策、文章、B站、X、支持我 -->
    <div class="bottom-button-group">
        <a class="button" href="privacy.html">
            <span class="icon-container">
                <!-- 隐私政策图标：直接显示原图，不上色 -->
                <img class="icon-img" src="infor.png" alt="隐私政策">
            </span>
            隐私政策
        </a>

        <a class="button" href="articles.html">
            <span class="icon-container">
                <span class="icon-mask" style="mask-image: url('book.png'); -webkit-mask-image: url('book.png');"></span>
                <img class="icon-overlay" src="bookred.png" alt="">
            </span>
        </a>

        <a class="button" href="https://space.bilibili.com/3546387744557738?spm_id_from=333.337.0.0" target="_blank">
            <span class="icon-container">
                <span class="icon-mask" style="mask-image: url('bilibili.png'); -webkit-mask-image: url('bilibili.png');"></span>
            </span>
        </a>

        <a class="button" href="https://x.com/i/status/2075440775723413893" target="_blank">
            <span class="icon-container">
                <span class="icon-mask" style="mask-image: url('X.png'); -webkit-mask-image: url('X.png');"></span>
            </span>
        </a>

        <a class="button" href="https://www.ifdian.net/order/create?user_id=9c51d8d47bff11f1bdbd5254001e7c00&amp;remark=&amp;affiliate_code=" target="_blank">
            <span class="icon-container">
                <span class="icon-mask" style="mask-image: url('happy.png'); -webkit-mask-image: url('happy.png');"></span>
            </span>
            支持我
        </a>
    </div>

    <script src="theme.js"></script>
    <script src="page-transition.js"></script>
</body>
</html>
