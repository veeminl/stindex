<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST -绿色蔬菜-</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 60px 40px;
            background-color: #ffffff;
            color: #37245f;               /* 全局默认深紫 */
        }
        /* 选中文本样式 */
        ::selection {
            background: #000000;
            color: #ffffff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: left;
        }
        h1 {
            font-size: 3em;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #37245f;
        }
        .subtitle {
            font-size: 1.2em;
            color: #37245f;
            margin-bottom: 3em;
            font-weight: 400;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }
        .button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2em;
            color: #37245f;
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: color 0.3s ease, filter 0.3s ease;
        }
        .button:hover {
            color: #000000;
        }

        /* 基础图标样式（用于普通按钮） */
        img.icon {
            width: 1.2em;
            height: 1.2em;
            image-rendering: pixelated;           /* 最近邻采样 */
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            transition: filter 0.3s ease;
        }
        .button:hover img.icon {
            filter: brightness(0);                /* 普通图标悬停变黑 */
        }

        /* 文章按钮的双图切换容器 */
        .icon-switch {
            position: relative;
            display: inline-block;
            width: 1.2em;
            height: 1.2em;
        }
        .icon-switch img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        .icon-switch img.icon-default {
            display: block;
        }
        .icon-switch img.icon-hover {
            display: none;
        }
        .button:hover .icon-switch img.icon-default {
            display: none;
        }
        .button:hover .icon-switch img.icon-hover {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ST</h1>
        <div class="subtitle">-绿色蔬菜-</div>

        <div class="button-group">
            <!-- 文章（双图切换） -->
            <a class="button" href="articles.html">
                <span class="icon-switch">
                    <img class="icon-default" src="book.png" alt="">
                    <img class="icon-hover" src="bookred.png" alt="">
                </span>
            </a>

            <!-- 切割模拟器（图标+文字） -->
            <a class="button" href="https://wwamr.lanzoum.com/iOgcJ42bzn7i" target="_blank">
                <img class="icon" src="qgq.png" alt="">
                天杀切割器
            </a>

            <!-- B站首页（仅图标） -->
            <a class="button" href="https://space.bilibili.com/3546387744557738?spm_id_from=333.337.0.0" target="_blank">
                <img class="icon" src="bilibili.png" alt="">
            </a>

            <!-- X（仅图标） -->
            <a class="button" href="https://x.com/i/status/2075440775723413893" target="_blank">
                <img class="icon" src="X.png" alt="">
            </a>

            <!-- 支持我（图标+文字） -->
            <a class="button" href="https://www.ifdian.net/order/create?user_id=9c51d8d47bff11f1bdbd5254001e7c00&amp;remark=&amp;affiliate_code=" target="_blank">
                <img class="icon" src="happy.png" alt="">
                支持我
            </a>
        </div>
    </div>
</body>
</html>
